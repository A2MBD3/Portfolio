<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=yes, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0a0f16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="হাগু এজেন্ট - মজার বাংলা এআই চ্যাট">
  <title>হাগু এজেন্ট • হাস্যকর AI</title>
  <style>
    /* ============ FUNNY FANCY CSS - SEPARATE BLOCK ============ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0f16;
      --bg-secondary: #111b26;
      --bg-card: rgba(16, 24, 36, 0.8);
      --bg-input: rgba(22, 34, 50, 0.75);
      --accent-pink: #f472b6;
      --accent-cyan: #22d3ee;
      --accent-yellow: #fbbf24;
      --accent-orange: #fb923c;
      --accent-gradient: linear-gradient(135deg, #f472b6 0%, #fb923c 40%, #fbbf24 80%, #22d3ee 100%);
      --accent-glow: rgba(244, 114, 182, 0.45);
      --text-primary: #f1f5f9;
      --text-secondary: #b9c7dd;
      --text-muted: #7b8ba8;
      --border-subtle: rgba(255, 255, 255, 0.07);
      --border-medium: rgba(255, 255, 255, 0.12);
      --border-glow: rgba(244, 114, 182, 0.35);
      --shadow-xl: 0 30px 70px -15px rgba(0, 0, 0, 0.8);
      --shadow-inner: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      --radius-3xl: 32px;
      --radius-2xl: 22px;
      --radius-xl: 18px;
      --radius-lg: 15px;
      --radius-full: 9999px;
      --font-sans: 'Inter', 'Segoe UI', system-ui, -apple-system, 'Noto Sans Bengali', 'Baloo Da 2', cursive, sans-serif;
      --transition-fast: 170ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-smooth: 280ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-spring: 350ms cubic-bezier(0.34, 1.56, 0.64, 1);
      --bounce: cubic-bezier(0.68, -0.55, 0.27, 1.55);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-primary: #fdf2f8;
        --bg-secondary: #fce7f3;
        --bg-card: rgba(255, 255, 255, 0.78);
        --bg-input: rgba(252, 231, 243, 0.8);
        --text-primary: #2d1e2f;
        --text-secondary: #5b4b5e;
        --text-muted: #7d6b80;
        --border-subtle: rgba(0, 0, 0, 0.07);
        --border-medium: rgba(0, 0, 0, 0.12);
        --border-glow: rgba(244, 114, 182, 0.4);
        --shadow-xl: 0 25px 55px -12px rgba(180, 80, 120, 0.25);
        --shadow-inner: inset 0 1px 0 rgba(0, 0, 0, 0.04);
      }
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg-primary);
      background-image:
        radial-gradient(ellipse 70% 55% at 40% -5%, rgba(251, 191, 36, 0.12) 0%, transparent 65%),
        radial-gradient(ellipse 55% 50% at 85% 85%, rgba(244, 114, 182, 0.1) 0%, transparent 70%),
        radial-gradient(ellipse 45% 45% at 15% 20%, rgba(34, 211, 238, 0.08) 0%, transparent 70%),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 2px, transparent 2px, transparent 8px);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      padding-bottom: max(14px, env(safe-area-inset-bottom, 14px));
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
      transition: background var(--transition-smooth);
    }

    .chat-container {
      width: 100%;
      max-width: 620px;
      height: 93vh;
      height: 93dvh;
      max-height: 900px;
      background: var(--bg-card);
      backdrop-filter: blur(45px) saturate(200%);
      -webkit-backdrop-filter: blur(45px) saturate(200%);
      border-radius: var(--radius-3xl);
      box-shadow: var(--shadow-xl), 0 0 0 1px var(--border-subtle), var(--shadow-inner);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      transition: all var(--transition-smooth);
      border: 1.2px solid var(--border-medium);
    }

    .chat-container::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1.2px;
      background: linear-gradient(150deg, rgba(251,191,36,0.35) 0%, rgba(244,114,182,0.3) 30%, transparent 55%, rgba(34,211,238,0.3) 80%, rgba(251,146,60,0.35) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: 10;
    }

    .header {
      padding: 18px 22px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(13, 21, 30, 0.7);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-bottom: 1px solid var(--border-subtle);
      position: relative;
      z-index: 5;
      flex-shrink: 0;
    }

    .logo-wrapper {
      position: relative;
      flex-shrink: 0;
    }

    .logo {
      width: 50px;
      height: 50px;
      background: var(--accent-gradient);
      border-radius: var(--radius-xl);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: #fff;
      box-shadow: 0 14px 28px -10px var(--accent-glow), 0 0 0 1.5px rgba(255,255,255,0.2) inset;
      transition: transform var(--transition-spring);
      cursor: pointer;
      user-select: none;
      animation: wiggleLogo 3.5s ease-in-out infinite;
    }

    @keyframes wiggleLogo {
      0%, 100% { transform: rotate(0deg) scale(1); }
      15% { transform: rotate(2deg) scale(1.05); }
      30% { transform: rotate(-2deg) scale(1.02); }
      45% { transform: rotate(1.5deg) scale(1.04); }
      60% { transform: rotate(0deg) scale(1); }
    }

    .logo:active {
      transform: scale(0.85) rotate(-8deg);
      transition: transform 0.1s ease;
    }

    .logo-pulse {
      position: absolute;
      inset: -8px;
      border-radius: 24px;
      background: var(--accent-gradient);
      opacity: 0.2;
      filter: blur(18px);
      z-index: -1;
      animation: logoGlow 2.8s ease-in-out infinite;
    }

    @keyframes logoGlow {
      0%, 100% { opacity: 0.15; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(1.1); }
    }

    .header-info h2 {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: var(--text-primary);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: linear-gradient(to right, #fbbf24, #f472b6, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background: var(--accent-cyan);
      border-radius: 50%;
      box-shadow: 0 0 16px var(--accent-cyan);
      flex-shrink: 0;
      animation: pulseDot 1.8s ease-in-out infinite;
    }

    @keyframes pulseDot {
      0%, 100% { box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.7); }
      60% { box-shadow: 0 0 0 14px rgba(34, 211, 238, 0); }
    }

    .status-text {
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-weight: 600;
      white-space: nowrap;
    }

    .icon-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-medium);
      color: var(--text-secondary);
      width: 42px;
      height: 42px;
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
      transition: all var(--transition-fast);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .icon-btn:active {
      background: rgba(251,191,36,0.15);
      transform: scale(0.9) rotate(15deg);
      border-color: var(--accent-yellow);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
      position: relative;
      z-index: 2;
      mask-image: linear-gradient(to bottom, transparent 0px, black 18px, black calc(100% - 10px), transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0px, black 18px, black calc(100% - 10px), transparent 100%);
    }

    .chat-messages::-webkit-scrollbar { width: 5px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; margin: 12px 0; }
    .chat-messages::-webkit-scrollbar-thumb { background: rgba(251,191,36,0.25); border-radius: 20px; }
    .chat-messages::-webkit-scrollbar-thumb:hover { background: rgba(244,114,182,0.45); }

    .greeting-badge {
      background: rgba(251, 191, 36, 0.1);
      border-radius: var(--radius-full);
      padding: 8px 22px;
      font-size: 0.82rem;
      color: var(--accent-yellow);
      align-self: center;
      margin-bottom: 6px;
      border: 1px dashed rgba(251,191,36,0.35);
      letter-spacing: 0.3px;
      backdrop-filter: blur(10px);
      font-weight: 600;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      animation: msgSlideIn 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes msgSlideIn {
      from { opacity: 0; transform: translateY(18px) scale(0.92) rotate(0.5deg); }
      to { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
    }

    .message.user { align-self: flex-end; align-items: flex-end; }
    .message.assistant { align-self: flex-start; align-items: flex-start; }

    .sender-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      padding: 0 8px;
      color: var(--text-muted);
      opacity: 0.9;
    }

    .bubble {
      padding: 12px 18px;
      font-size: 0.95rem;
      line-height: 1.65;
      word-break: break-word;
      white-space: pre-wrap;
      border-radius: var(--radius-2xl);
      transition: box-shadow var(--transition-fast);
      position: relative;
      font-weight: 480;
    }

    .message.user .bubble {
      background: linear-gradient(145deg, #f472b6 0%, #fb923c 100%);
      color: #ffffff;
      border-bottom-right-radius: 6px;
      box-shadow: 0 12px 26px -8px rgba(244, 114, 182, 0.55);
      border: 1px solid rgba(255,255,255,0.2);
    }

    .message.assistant .bubble {
      background: rgba(22, 34, 50, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #e0e7f5;
      border-bottom-left-radius: 6px;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
      position: relative;
      overflow: hidden;
    }

    .message.assistant .bubble::after {
      content: "😂";
      position: absolute;
      bottom: 4px;
      right: 10px;
      font-size: 1.4rem;
      opacity: 0.25;
      pointer-events: none;
    }

    @media (prefers-color-scheme: light) {
      .message.assistant .bubble {
        background: rgba(253, 242, 248, 0.9);
        color: #3d2c3a;
        border: 1px solid rgba(0,0,0,0.08);
        box-shadow: 0 4px 14px rgba(180, 100, 140, 0.12);
      }
      .message.assistant .bubble::after { opacity: 0.15; }
    }

    .typing-indicator {
      display: flex;
      gap: 6px;
      padding: 16px 20px;
      background: rgba(22, 34, 50, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: var(--radius-2xl);
      border-bottom-left-radius: 6px;
      width: fit-content;
      align-items: center;
      border: 1px solid var(--border-subtle);
    }

    .typing-indicator span {
      width: 10px;
      height: 10px;
      background: #fbbf24;
      border-radius: 50%;
      animation: bounceTyping 1.2s infinite var(--bounce);
      box-shadow: 0 0 12px #fbbf24;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; background: #f472b6; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; background: #22d3ee; }

    @keyframes bounceTyping {
      0%, 70%, 100% { transform: translateY(0); opacity: 0.7; }
      40% { transform: translateY(-12px); opacity: 1; }
    }

    .input-area {
      padding: 14px 18px 16px;
      padding-bottom: max(16px, env(safe-area-inset-bottom, 16px));
      border-top: 1px solid var(--border-subtle);
      background: rgba(13, 21, 30, 0.75);
      backdrop-filter: blur(35px);
      -webkit-backdrop-filter: blur(35px);
      display: flex;
      gap: 12px;
      align-items: flex-end;
      position: relative;
      z-index: 5;
      flex-shrink: 0;
    }

    .input-wrapper {
      flex: 1;
      background: var(--bg-input);
      border-radius: var(--radius-full);
      border: 2px solid var(--border-medium);
      display: flex;
      align-items: flex-end;
      padding: 5px 7px 5px 22px;
      transition: border var(--transition-fast), box-shadow var(--transition-fast), background var(--transition-fast);
    }

    .input-wrapper:focus-within {
      border-color: var(--accent-pink);
      box-shadow: 0 0 0 5px rgba(244, 114, 182, 0.2), 0 0 20px rgba(251,191,36,0.2);
      background: rgba(30, 42, 58, 0.9);
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 0.96rem;
      padding: 10px 0;
      resize: none;
      max-height: 140px;
      line-height: 1.5;
      font-family: inherit;
      caret-color: var(--accent-pink);
      transition: color var(--transition-fast);
    }

    textarea::placeholder { color: #6b7a94; font-weight: 400; opacity: 0.8; }

    .send-btn {
      background: var(--accent-gradient);
      border: none;
      color: white;
      width: 50px;
      height: 50px;
      min-width: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition-spring);
      box-shadow: 0 12px 26px -6px rgba(244, 114, 182, 0.55);
      flex-shrink: 0;
      margin-bottom: 2px;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: hidden;
    }

    .send-btn::after {
      content: "💨";
      position: absolute;
      font-size: 1.2rem;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .send-btn:active::after { opacity: 1; }
    .send-btn svg { width: 22px; height: 22px; fill: currentColor; transition: transform var(--transition-fast); }
    .send-btn:active { transform: scale(0.82) rotate(10deg); box-shadow: 0 6px 16px rgba(251,191,36,0.6); }
    .send-btn.disabled { opacity: 0.35; pointer-events: none; filter: grayscale(50%); box-shadow: none; }

    @media (max-width: 520px) {
      body { padding: 6px; }
      .chat-container { height: 97vh; height: 97dvh; border-radius: 26px; max-height: none; }
      .header { padding: 14px 16px; }
      .logo { width: 44px; height: 44px; font-size: 22px; }
      .bubble { font-size: 0.9rem; padding: 10px 15px; }
      .send-btn { width: 46px; height: 46px; min-width: 46px; }
    }

    .offline-banner {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.45);
      color: #fecaca;
      padding: 10px 22px;
      border-radius: var(--radius-full);
      font-size: 0.85rem;
      font-weight: 600;
      backdrop-filter: blur(25px);
      z-index: 20;
      pointer-events: none;
      opacity: 0;
      transition: opacity var(--transition-smooth);
      text-align: center;
    }
    .offline-banner.visible { opacity: 1; }
  </style>
</head>

    <div class="input-area">
      <div class="input-wrapper">
        <textarea id="userInput" rows="1" placeholder="তোমার মজার প্রশ্ন লিখো..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>

  </div>

      );

      const SYSTEM_PROMPT = SYSTEM_PROMPT_CONTENT
        .replace('{AI_NAME}', AI_NAME)
        .replace('{CREATOR_NAME}', CREATOR_NAME)
        .replace('{CREATOR_SITE}', CREATOR_SITE);

      // DOM refs
      const chatMessages = document.getElementById('chatMessages');
      const userInput = document.getElementById('userInput');
      const sendBtn = document.getElementById('sendBtn');
      const clearBtn = document.getElementById('clearChatBtn');
      const offlineBanner = document.getElementById('offlineBanner');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const aiNameEl = document.getElementById('aiName');

      if (aiNameEl) aiNameEl.textContent = AI_NAME;

      let isProcessing = false;
      let conversationHistory = [{ role: "system", content: SYSTEM_PROMPT }];

      const escapeHTML = (str) => {
        const div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
      };

      const scrollToBottom = () => {
        requestAnimationFrame(() => {
          if (chatMessages) chatMessages.scrollTop = chatMessages.scrollHeight;
        });
      };

      const setProcessing = (state) => {
        isProcessing = state;
        if (sendBtn) sendBtn.classList.toggle('disabled', state);
        if (userInput) {
          userInput.placeholder = state ? `${AI_NAME} হাসির উত্তর দিচ্ছে...` : 'তোমার মজার প্রশ্ন লিখো...';
          if (!state) setTimeout(() => userInput.focus(), 100);
        }
      };

      const updateOnlineStatus = () => {
        const online = navigator.onLine;
        if (statusDot) {
          statusDot.style.background = online ? 'var(--accent-cyan)' : '#ef4444';
          statusDot.style.boxShadow = online ? '0 0 16px var(--accent-cyan)' : '0 0 16px #ef4444';
        }
        if (statusText) statusText.textContent = online ? 'মজা অনলাইন • ফ্রি' : 'অফলাইন • হাসি বন্ধ';
        if (offlineBanner) offlineBanner.classList.toggle('visible', !online);
      };

      const addMessage = (role, text, isHTML = false) => {
        if (!chatMessages) return;
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}`;
        const label = role === 'user' ? 'তুমি' : AI_NAME;
        const content = isHTML ? text : escapeHTML(text);
        msgDiv.innerHTML = `<span class="sender-label">${escapeHTML(label)}</span><div class="bubble">${content}</div>`;
        chatMessages.appendChild(msgDiv);
        scrollToBottom();
        saveHistory();
      };

      const showTyping = () => {
        if (!chatMessages) return null;
        const id = `typing-${Date.now()}`;
        const div = document.createElement('div');
        div.className = 'message assistant';
        div.id = id;
        div.innerHTML = `<span class="sender-label">${escapeHTML(AI_NAME)}</span><div class="typing-indicator"><span></span><span></span><span></span></div>`;
        chatMessages.appendChild(div);
        scrollToBottom();
        return id;
      };

      const removeTyping = (id) => { if (id) document.getElementById(id)?.remove(); };

      const saveHistory = () => {
        try {
          const toSave = conversationHistory.slice(1);
          localStorage.setItem('hagu_funny_history', JSON.stringify(toSave));
        } catch (e) {}
      };

      const loadHistory = () => {
        try {
          const saved = localStorage.getItem('hagu_funny_history');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length) {
              conversationHistory = [{ role: "system", content: SYSTEM_PROMPT }, ...parsed];
              parsed.forEach(msg => { if (msg.role === 'user' || msg.role === 'assistant') addMessage(msg.role, msg.content); });
              return true;
            }
          }
        } catch (e) {}
        return false;
      };

      const resetChat = () => {
        if (isProcessing) return;
        conversationHistory = [{ role: "system", content: SYSTEM_PROMPT }];
        if (chatMessages) {
          chatMessages.innerHTML = '';
          const gDiv = document.createElement('div');
          gDiv.className = 'greeting-badge';
          gDiv.textContent = '😂 নতুন হাসির পালা শুরু';
          chatMessages.appendChild(gDiv);
        }
        localStorage.removeItem('hagu_funny_history');
        addMessage('assistant', `হ্যালো দোস্ত! আমি ${AI_NAME}, তোমার পেটফাটা হাসির এআই। যা খুশি জিজ্ঞেস করো, আমি মজার উত্তর দেবো! 🚽✨`);
      };

      const fetchAIResponse = async (typingId) => {
        if (!navigator.onLine) {
          removeTyping(typingId);
          addMessage('assistant', '⚠️ ইন্টারনেট নেই! হাসিও থেমে গেলো... পরে আয়।');
          setProcessing(false);
          return;
        }
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 25000);
          const response = await fetch(API_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${API_KEY}`,
              'HTTP-Referer': window.location.href,
              'X-Title': 'Hagu-Funny-AI'
            },
            body: JSON.stringify({
              model: MODEL,
              messages: conversationHistory,
              temperature: 0.85,
              max_tokens: 800,
              top_p: 0.95,
              frequency_penalty: 0.3
            }),
            signal: controller.signal
          });
          clearTimeout(timeoutId);
          removeTyping(typingId);
          if (!response.ok) throw new Error(`সার্ভার হাসলো না (${response.status})`);
          const data = await response.json();
          const reply = data?.choices?.[0]?.message?.content || '🤣 দুঃখিত, হাসির বালতি খালি!';
          addMessage('assistant', reply);
          conversationHistory.push({ role: 'assistant', content: reply });
          if (conversationHistory.length > 21) conversationHistory = [conversationHistory[0], ...conversationHistory.slice(-20)];
        } catch (error) {
          removeTyping(typingId);
          addMessage('assistant', `💩 উফ! ${error.message || 'হাসতে হাসতে আটকে গেলাম'}`);
        } finally {
          setProcessing(false);
        }
      };

      const sendMessage = () => {
        if (isProcessing) return;
        const text = userInput?.value.trim();
        if (!text || text.length > 2000) return;
        const sanitized = text.replace(/[\u0000-\u001F\u007F-\u009F]/g, '');
        addMessage('user', sanitized);
        conversationHistory.push({ role: 'user', content: sanitized });
        if (userInput) { userInput.value = ''; userInput.style.height = 'auto'; }
        const typingId = showTyping();
        setProcessing(true);
        fetchAIResponse(typingId);
      };

      const debounce = (fn, delay) => { let timer; return function(...args) { clearTimeout(timer); timer = setTimeout(() => fn.apply(this, args), delay); }; };

      if (userInput) {
        userInput.addEventListener('input', debounce(function() {
          this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 140) + 'px';
        }, 120));
        userInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
      }
      if (sendBtn) sendBtn.addEventListener('click', sendMessage);
      if (clearBtn) clearBtn.addEventListener('click', resetChat);
      window.addEventListener('online', updateOnlineStatus);
      window.addEventListener('offline', updateOnlineStatus);

      const init = () => {
        updateOnlineStatus();
        if (!loadHistory() && chatMessages) {
          const gDiv = document.createElement('div');
          gDiv.className = 'greeting-badge';
          gDiv.textContent = '✨ আজ হাসির দিন';
          chatMessages.appendChild(gDiv);
          addMessage('assistant', `হ্যালো দোস্ত! আমি ${AI_NAME}, তোমার পেটফাটা হাসির এআই। যা খুশি জিজ্ঞেস করো, আমি মজার উত্তর দেবো! 🚽✨`);
        }
        if (window.innerWidth > 768) setTimeout(() => userInput?.focus(), 400);
        scrollToBottom();
      };
      init();

      window.HaguChat = { reset: resetChat, send: sendMessage, version: '2.0-funny' };
      console.log(`%c🤣 ${AI_NAME} %cহাসির রাজা %c• %cBase64 Encoded`,
        'font-weight:bold;color:#f472b6;', 'color:#fbbf24;', '', 'color:#22d3ee;');
    })();
  </script>
