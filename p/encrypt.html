<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>নিউমরফিক এনক্রিপশন • ডিক্রিপ্ট</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, 'Roboto', sans-serif;
    }

    body {
      background: #e9edf2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: #e9edf2;
      border-radius: 42px;
      padding: 18px 16px 14px;
      box-shadow: 
        12px 12px 24px rgba(166, 173, 189, 0.7),
        -8px -8px 18px rgba(255, 255, 255, 0.9),
        inset 1px 1px 2px rgba(255, 255, 255, 0.6),
        inset -1px -1px 2px rgba(166, 173, 189, 0.3);
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 100vh;
      max-height: 100dvh;
      overflow-y: auto;
    }

    .header {
      background: transparent;
      padding: 8px 12px 4px;
      text-align: center;
      border-radius: 30px;
      box-shadow: 
        inset 3px 3px 7px rgba(166, 173, 189, 0.5),
        inset -4px -4px 8px rgba(255, 255, 255, 0.9);
      margin-bottom: 2px;
      flex-shrink: 0;
    }

    .header h1 {
      font-size: clamp(1.2rem, 5vw, 1.7rem);
      font-weight: 600;
      color: #2c3e50;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
      line-height: 1.3;
    }

    .header p {
      font-size: 0.7rem;
      color: #546e7a;
      margin-top: 2px;
      font-weight: 500;
      word-break: break-word;
    }

    .text-areas {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    .text-area-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .text-area-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 0.75rem;
      color: #37474f;
      margin-left: 6px;
    }

    textarea {
      width: 100%;
      height: 80px;
      padding: 10px 14px;
      border: none;
      border-radius: 24px;
      background: #e9edf2;
      font-size: 0.85rem;
      resize: none;
      box-shadow: 
        inset 5px 5px 10px rgba(166, 173, 189, 0.6),
        inset -5px -5px 10px rgba(255, 255, 255, 0.8);
      color: #1e2b38;
      font-weight: 500;
      outline: none;
      transition: all 0.2s ease;
    }

    textarea:focus {
      box-shadow: 
        inset 4px 4px 8px rgba(166, 173, 189, 0.7),
        inset -4px -4px 8px white,
        0 0 0 2px rgba(100, 140, 200, 0.4);
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
    }

    /* Mode selector with glowing border for active */
    .mode-selector {
      display: flex;
      background: #e9edf2;
      border-radius: 30px;
      padding: 5px;
      box-shadow: 
        inset 4px 4px 8px rgba(166, 173, 189, 0.5),
        inset -4px -4px 8px rgba(255, 255, 255, 0.8);
      gap: 4px;
    }

    .mode-option {
      flex: 1;
      padding: 12px 5px;
      text-align: center;
      cursor: pointer;
      background: transparent;
      border: 2px solid transparent;
      border-radius: 26px;
      font-weight: 600;
      font-size: 0.85rem;
      color: #546e7a;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.25s ease;
      position: relative;
    }

    /* Active mode with glowing colored border */
    .mode-option.active {
      background: #e9edf2;
      color: #0d3b4f;
      font-weight: 700;
      box-shadow: 
        7px 7px 14px rgba(166, 173, 189, 0.6),
        -5px -5px 12px rgba(255, 255, 255, 0.95);
      border: 2px solid #3f51b5;
      animation: glowPulse 2s infinite ease-in-out;
    }

    @keyframes glowPulse {
      0% { box-shadow: 0 0 6px 1px rgba(63, 81, 181, 0.5), 7px 7px 14px rgba(166, 173, 189, 0.6), -5px -5px 12px rgba(255, 255, 255, 0.95); }
      50% { box-shadow: 0 0 14px 3px rgba(63, 81, 181, 0.8), 7px 7px 14px rgba(166, 173, 189, 0.6), -5px -5px 12px rgba(255, 255, 255, 0.95); }
      100% { box-shadow: 0 0 6px 1px rgba(63, 81, 181, 0.5), 7px 7px 14px rgba(166, 173, 189, 0.6), -5px -5px 12px rgba(255, 255, 255, 0.95); }
    }

    .encryption-types {
      display: flex;
      gap: 10px;
    }

    .encryption-type {
      flex: 1;
      padding: 12px 6px;
      border: 2px solid transparent;
      border-radius: 24px;
      background: #e9edf2;
      font-weight: 600;
      font-size: 0.8rem;
      color: #455a64;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      box-shadow: 
        5px 5px 10px rgba(166, 173, 189, 0.5),
        -5px -5px 10px rgba(255, 255, 255, 0.8);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    /* Encryption type active with glowing border */
    .encryption-type.active {
      box-shadow: 
        inset 4px 4px 8px rgba(166, 173, 189, 0.65),
        inset -4px -4px 8px white;
      color: #0b2b3b;
      font-weight: 700;
      background: #e9edf2;
      border: 2px solid #ff4081;
      animation: glowEncryption 2s infinite ease-in-out;
    }

    @keyframes glowEncryption {
      0% { box-shadow: inset 4px 4px 8px rgba(166, 173, 189, 0.65), inset -4px -4px 8px white, 0 0 6px 1px rgba(255, 64, 129, 0.5); }
      50% { box-shadow: inset 4px 4px 8px rgba(166, 173, 189, 0.65), inset -4px -4px 8px white, 0 0 14px 3px rgba(255, 64, 129, 0.8); }
      100% { box-shadow: inset 4px 4px 8px rgba(166, 173, 189, 0.65), inset -4px -4px 8px white, 0 0 6px 1px rgba(255, 64, 129, 0.5); }
    }

    .password-section {
      display: none;
    }

    .password-section.active {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .password-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .password-option {
      flex: 1 0 auto;
      min-width: 65px;
      padding: 10px 4px;
      border: 2px solid transparent;
      border-radius: 20px;
      background: #e9edf2;
      font-size: 0.7rem;
      font-weight: 600;
      color: #2c3e50;
      box-shadow: 
        3px 3px 7px rgba(166, 173, 189, 0.4),
        -3px -3px 7px rgba(255, 255, 255, 0.8);
      cursor: pointer;
      transition: all 0.2s;
    }

    .password-option.active {
      box-shadow: 
        inset 2px 2px 5px rgba(166, 173, 189, 0.6),
        inset -2px -2px 5px white;
      font-weight: 700;
      border: 2px solid #ff9800;
      animation: glowPassword 2s infinite ease-in-out;
    }

    @keyframes glowPassword {
      0% { box-shadow: inset 2px 2px 5px rgba(166, 173, 189, 0.6), inset -2px -2px 5px white, 0 0 4px 1px rgba(255, 152, 0, 0.5); }
      50% { box-shadow: inset 2px 2px 5px rgba(166, 173, 189, 0.6), inset -2px -2px 5px white, 0 0 10px 3px rgba(255, 152, 0, 0.8); }
      100% { box-shadow: inset 2px 2px 5px rgba(166, 173, 189, 0.6), inset -2px -2px 5px white, 0 0 4px 1px rgba(255, 152, 0, 0.5); }
    }

    .custom-password input {
      width: 100%;
      padding: 12px 14px;
      border: none;
      border-radius: 22px;
      background: #e9edf2;
      box-shadow: inset 4px 4px 8px rgba(166, 173, 189, 0.5), inset -4px -4px 8px white;
      font-size: 0.8rem;
      margin-top: 4px;
      outline: none;
    }

    .action-buttons {
      display: flex;
      gap: 12px;
      margin-top: 2px;
    }

    .action-btn {
      flex: 1;
      padding: 14px 8px;
      border: none;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #e9edf2;
      box-shadow: 
        7px 7px 14px rgba(166, 173, 189, 0.5),
        -6px -6px 12px rgba(255, 255, 255, 0.9);
      color: #1e3b4f;
      cursor: pointer;
      transition: 0.15s;
    }

    .action-btn:active {
      box-shadow: inset 5px 5px 10px rgba(166, 173, 189, 0.6), inset -5px -5px 10px white;
    }

    .copy-btn { color: #2e7d32; }
    .clear-btn { color: #b71c1c; }

    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #e9edf2;
      padding: 10px 18px;
      border-radius: 30px;
      font-weight: 600;
      color: #2e7d32;
      box-shadow: 6px 6px 14px rgba(166, 173, 189, 0.6), -4px -4px 10px white;
      transform: translateX(160%);
      transition: 0.25s;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
    }

    .notification.show {
      transform: translateX(0);
    }

    /* hide scrollbar when not needed */
    .container::-webkit-scrollbar {
      width: 3px;
    }
    .container::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.15);
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>
        <span class="material-icons" style="font-size:1.5rem;">encrypted</span> 
        এনক্রিপশন টুল
      </h1>
      <p>ডিক্রিপ্ট মোড · Base64</p>
    </div>

    <div class="text-areas">
      <div class="text-area-container">
        <div class="text-area-label"><span class="material-icons">edit</span> ইনপুট</div>
        <textarea id="input-text" placeholder="এনক্রিপ্টেড টেক্সট লিখুন..."></textarea>
      </div>
      <div class="text-area-container output-container">
        <div class="text-area-label"><span class="material-icons">lock_open</span> আউটপুট</div>
        <textarea id="output-text" readonly placeholder="ডিক্রিপ্টেড ফলাফল..."></textarea>
      </div>
    </div>

    <div class="controls">
      <div class="mode-selector">
        <button class="mode-option" data-mode="encode">
          <span class="material-icons">lock</span> এনক্রিপ্ট
        </button>
        <button class="mode-option active" data-mode="decode">
          <span class="material-icons">lock_open</span> ডিক্রিপ্ট
        </button>
      </div>

      <div class="options-row">
        <div class="option-group">
          <div class="option-label"><span class="material-icons">security</span> টাইপ</div>
          <div class="encryption-types">
            <button class="encryption-type active" data-type="base64">
              <span class="material-icons">tag</span> Base64
            </button>
            <button class="encryption-type" data-type="aes">
              <span class="material-icons">enhanced_encryption</span> AES
            </button>
          </div>
        </div>

        <div class="option-group password-section" id="password-section">
          <div class="option-label"><span class="material-icons">vpn_key</span> পাসওয়ার্ড</div>
          <div class="password-options">
            <button class="password-option active" data-password="am">am</button>
            <button class="password-option" data-password="abdullah">abdullah</button>
            <button class="password-option" data-password="secret">secret</button>
            <button class="password-option" data-password="password">password</button>
            <button class="password-option" data-password="123456">123456</button>
            <button class="password-option" data-password="custom">কাস্টম</button>
          </div>
          <div class="custom-password">
            <input type="text" id="custom-password-input" placeholder="নিজস্ব পাসওয়ার্ড">
          </div>
        </div>
      </div>

      <div class="action-buttons">
        <button class="action-btn copy-btn" id="copy-btn">
          <span class="material-icons">content_copy</span> কপি
        </button>
        <button class="action-btn clear-btn" id="clear-btn">
          <span class="material-icons">clear</span> ক্লিয়ার
        </button>
      </div>
    </div>
  </div>

  <div class="notification" id="notification">
    <span class="material-icons">check_circle</span> কপি সম্পন্ন
  </div>

  <script>
    (function() {
      const modeOptions = document.querySelectorAll('.mode-option');
      const encryptionTypes = document.querySelectorAll('.encryption-type');
      const passwordSection = document.getElementById('password-section');
      const passwordOptions = document.querySelectorAll('.password-option');
      const customPasswordInput = document.getElementById('custom-password-input');
      const inputText = document.getElementById('input-text');
      const outputText = document.getElementById('output-text');
      const copyBtn = document.getElementById('copy-btn');
      const clearBtn = document.getElementById('clear-btn');
      const notification = document.getElementById('notification');

      let selectedMode = 'decode';
      let selectedEncryption = 'base64';
      let selectedPassword = 'am';
      let isCustomPassword = false;

      customPasswordInput.style.display = 'none';
      passwordSection.classList.remove('active');

      function updateHeaderText() {
        const headerP = document.querySelector('.header p');
        if (headerP) {
          const modeText = selectedMode === 'decode' ? 'ডিক্রিপ্ট মোড' : 'এনক্রিপ্ট মোড';
          const encText = selectedEncryption === 'base64' ? 'Base64' : 'AES';
          headerP.textContent = `${modeText} · ${encText}`;
        }
      }
      updateHeaderText();

      modeOptions.forEach(btn => {
        btn.addEventListener('click', () => {
          modeOptions.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedMode = btn.dataset.mode;
          updateHeaderText();
          processText();
        });
      });

      encryptionTypes.forEach(btn => {
        btn.addEventListener('click', () => {
          encryptionTypes.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedEncryption = btn.dataset.type;
          
          if (selectedEncryption === 'aes') {
            passwordSection.classList.add('active');
          } else {
            passwordSection.classList.remove('active');
          }
          updateHeaderText();
          processText();
        });
      });

      passwordOptions.forEach(btn => {
        btn.addEventListener('click', () => {
          passwordOptions.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedPassword = btn.dataset.password;
          isCustomPassword = (selectedPassword === 'custom');
          customPasswordInput.style.display = isCustomPassword ? 'block' : 'none';
          processText();
        });
      });

      let timeout;
      function processText() {
        clearTimeout(timeout);
        timeout = setTimeout(() => {
          const text = inputText.value.trim();
          if (!text) {
            outputText.value = '';
            return;
          }

          const password = isCustomPassword ? customPasswordInput.value : selectedPassword;

          try {
            let result = '';
            if (selectedMode === 'encode') {
              if (selectedEncryption === 'base64') {
                result = btoa(unescape(encodeURIComponent(text)));
              } else if (selectedEncryption === 'aes') {
                if (!password) {
                  result = 'পাসওয়ার্ড দিন';
                } else {
                  result = CryptoJS.AES.encrypt(text, password).toString();
                }
              }
            } else {
              if (selectedEncryption === 'base64') {
                try {
                  let decoded = atob(text);
                  try {
                    result = decodeURIComponent(escape(decoded));
                  } catch (e) {
                    result = decoded;
                  }
                } catch (e) {
                  result = 'ভুল Base64 ইনপুট';
                }
              } else if (selectedEncryption === 'aes') {
                if (!password) {
                  result = 'পাসওয়ার্ড প্রয়োজন';
                } else {
                  try {
                    const bytes = CryptoJS.AES.decrypt(text, password);
                    result = bytes.toString(CryptoJS.enc.Utf8);
                    if (!result) {
                      result = 'ভুল পাসওয়ার্ড অথবা টেক্সট';
                    }
                  } catch (e) {
                    result = 'ডিক্রিপ্ট ব্যর্থ';
                  }
                }
              }
            }
            outputText.value = result;
          } catch (error) {
            outputText.value = 'প্রক্রিয়াকরণ ত্রুটি';
          }
        }, 80);
      }

      inputText.addEventListener('input', processText);
      customPasswordInput.addEventListener('input', processText);

      copyBtn.addEventListener('click', () => {
        if (outputText.value) {
          outputText.select();
          document.execCommand('copy');
          notification.classList.add('show');
          setTimeout(() => notification.classList.remove('show'), 1500);
        }
      });

      clearBtn.addEventListener('click', () => {
        inputText.value = '';
        outputText.value = '';
        inputText.focus();
      });

      window.addEventListener('load', () => {
        inputText.focus();
      });
    })();
  </script>
</body>
</html>
