<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Howler vs Warbringer - Tic Tac Toe</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #000000, #000000);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    h1 {
      margin: 20px 0 10px;
      font-size: 2.5rem;
      color: #0ff;
      text-shadow: 0 0 10px #0ff;
    }

    .notification {
    position: fixed;
      top: 24%;
      font-size: 1.5rem;
      font-weight: bold;
      margin: 10px;
      padding: 20px 40px;
      background-color: rgba(0, 255, 255, 0.1);
      border: 3px solid #FF0000;
      border-shadow: 0 0 10px #0ff;
      border-radius: 10px;
      text-align: center;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .board {
    position: fixed;
      top: 35%;
      
      display: grid;
      grid-template-columns: repeat(3, 100px);
      gap: 10px;
      justify-content: center;
      margin: 20px auto;
    }

    .cell {
      width: 100px;
      height: 100px;
      background-color: #1b1b2f;
      border: 2px solid #0ff;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.5rem;
      color: #0ff;
      cursor: pointer;
      box-shadow: 0 0 10px #0ff;
      transition: transform 0.2s;
    }

    .cell:hover {
      background-color: #333355;
      transform: scale(1.05);
    }

    button {
      background-color: #ffffff22;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 1rem;
      color: white;
      cursor: pointer;
      margin: 15px 0;
      box-shadow: 0 0 8px #0ff;
    }

    button:hover {
      background-color: #ffffff44;
    }

    .popup {
      position: fixed;
      top: 55%;
      left: 50%;
      color: #0ff;
      text-shadow: 0 0 10px #0ff;
      transform: translateX(-50%);
      background-color: #0f0f1a;
      border: 3px solid #0ff;
      padding: 40px;
      font-size: 2rem;
      color: #0ff;
      text-align: center;
      border-radius: 10px;
      z-index: 999;
      box-shadow: 0 0 20px #0ff;
      animation: popupFade 0.5s ease-in-out;
    }

    @keyframes popupFade {
      0% { transform: translateX(-50%) scale(0.7); opacity: 0; }
      100% { transform: translateX(-50%) scale(1); opacity: 1; }
    }

    .footer {
      position: absolute;
      bottom: 10px;
      font-size: 0.9rem;
      color: #aaa;
    }

    .footer a {
      color: #0ff;
      text-decoration: none;
    }

    .emoji {
      position: fixed;
      font-size: 2rem;
      animation: fall 3s linear infinite;
      z-index: 500;
    }

    @keyframes fall {
      0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <h1>Howler vs Warbringer</h1>
  <div id="status" class="notification">👉 Howler---X</div>

  <div class="board" id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>

  <button onclick="resetGame()">🔁 আবার শুরু করো</button>

  <div class="footer">
    All rights reserved by <a href="https://facebook.com/a2mbd3" target="_blank">Developer</a>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const cells = document.querySelectorAll('.cell');
    let currentPlayer = 'X';
    let boardState = Array(9).fill("");
    let gameActive = true;

    const players = {
      X: "Howler--X",
      O: "Warbringer--0"
    };

    const winningCombinations = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    cells.forEach(cell => {
      cell.addEventListener("click", handleClick);
    });

    function handleClick(e) {
      const index = e.target.dataset.index;

      if (!gameActive || boardState[index] !== "") return;

      boardState[index] = currentPlayer;
      e.target.textContent = currentPlayer;

      if (checkWin(currentPlayer)) {
        showPopup(`🏆 ${players[currentPlayer]} জয়ী হয়েছে!`);
        emojiRain();
        gameActive = false;
        return;
      }

      if (boardState.every(cell => cell !== "")) {
        showPopup("😐 খেলা ড্র হয়েছে!");
        emojiRain();
        gameActive = false;
        return;
      }

      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      statusEl.textContent = `👉 ${players[currentPlayer]}`;
    }

    function checkWin(player) {
      return winningCombinations.some(combination => {
        return combination.every(i => boardState[i] === player);
      });
    }

    function resetGame() {
      boardState = Array(9).fill("");
      currentPlayer = "X";
      gameActive = true;
      cells.forEach(cell => cell.textContent = "");
      statusEl.textContent = `👉 ${players[currentPlayer]}`;
    }

    function showPopup(message) {
      const popup = document.createElement('div');
      popup.classList.add('popup');
      popup.textContent = message;
      document.body.appendChild(popup);

      setTimeout(() => {
        popup.remove();
      }, 4000);
    }

    function emojiRain() {
      const emojis = ['🎉', '🥳', '✨', '🎊', '💥', '🎈'];
      for (let i = 0; i < 30; i++) {
        const emoji = document.createElement('div');
        emoji.classList.add('emoji');
        emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        emoji.style.left = Math.random() * 100 + "vw";
        emoji.style.animationDuration = (2 + Math.random() * 2) + "s";
        document.body.appendChild(emoji);
        setTimeout(() => emoji.remove(), 5000);
      }
    }
  </script>
</body>
</html>
